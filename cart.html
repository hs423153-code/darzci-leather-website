<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darzci — Cart</title>
  <link rel="stylesheet" href="css/cart.css" />
</head>
<body>
 <!-- =========================================
                CART HERO
========================================= -->

<section class="cart-hero">

  <p class="cart-tag">
    YOUR SELECTIONS
  </p>

  <h1>
    Shopping Cart
  </h1>

  <p class="cart-sub">
    Review your handcrafted luxury pieces
    before placing your WhatsApp order.
  </p>

</section>



<!-- =========================================
                CART SECTION
========================================= -->

<section class="cart-section container">

  <!-- PRODUCTS -->

  <div
    class="cart-products"
    id="cartProducts">

  </div>



  <!-- SUMMARY -->

  <div class="cart-summary">

    <p class="summary-tag">
      ORDER SUMMARY
    </p>

    <div class="summary-row">

      <span>Subtotal</span>

      <span id="subtotal">
        ₹0
      </span>

    </div>

    <div class="summary-row">

      <span>Shipping</span>

      <span>
        Free
      </span>

    </div>

    <div class="summary-total">

      <span>Total</span>

      <span id="total">
        ₹0
      </span>

    </div>


    <!-- WHATSAPP -->

    <a
      href="#"
      class="whatsapp-btn"
      id="whatsappOrder">

      Order Via WhatsApp

    </a>

  </div>

  <section class="recommended-products container">

  <div class="section-header">
    <h2>You May Also Like</h2>
  </div>

  <div class="product-track" id="recommendationGrid">

  </div>

</section>

  <section class="recommended-products container">

    <div class="section-header">
        <h2>Best Sellers</h2>
    </div>

    <div class="product-track"
         id="bestSellerGrid">

    </div>

</section>

</section>
</body>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
</html>
